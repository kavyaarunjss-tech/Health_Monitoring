<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>AQ Health</title>
<style>
/* Inter (SIL Open Font License 1.1, fonts/OFL.txt), bundled so it works offline; same font as the website */
@font-face { font-family: "Inter"; font-style: normal; font-weight: 400 700; font-display: swap; src: url("fonts/inter-latin-ext-wght.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
    U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Inter"; font-style: normal; font-weight: 400 700; font-display: swap; src: url("fonts/inter-latin-wght.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191,
    U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
/* Lora (SIL Open Font License 1.1, fonts/OFL-Lora.txt), unmodified variable font 400-700: editorial headlines */
@font-face { font-family: "Lora"; font-style: normal; font-weight: 400 700; font-display: swap; src: url("fonts/Lora-Variable.ttf") format("truetype"); }
html, body, #root { margin: 0; height: 100%; background: #f6f1e9; color: #1e1b18; -webkit-tap-highlight-color: transparent; }
html[data-theme="dark"], html[data-theme="dark"] body { background: #121110; color: #f3eee7; }
@keyframes aqspin { to { transform: rotate(360deg); } }
[role="button"]:focus-visible, [role="tab"]:focus-visible, [role="radio"]:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #a2482a; outline-offset: 2px; }
html[data-theme="dark"] [role="button"]:focus-visible, html[data-theme="dark"] [role="tab"]:focus-visible, html[data-theme="dark"] [role="radio"]:focus-visible, html[data-theme="dark"] button:focus-visible, html[data-theme="dark"] input:focus-visible { outline-color: #f2b48f; }
input::placeholder { color: #8a8177; }
#root [data-scroll] { overflow-x: hidden; scrollbar-width: none; }
#root [data-scroll]::-webkit-scrollbar { display: none; }
html { font-family: "Inter", Roboto, system-ui, sans-serif; font-feature-settings: "tnum" 1, "cv11" 1, "ss01" 1;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
input, button, textarea, select { font: inherit; }
#root { display: flex; flex-direction: column; }
</style>
<script>
// colours before the app loads: the saved choice (Light / Dark / System), else the phone's setting
(function () {
  try {
    var m = localStorage.getItem('aqhealth.theme') || 'system';
    var dark = m === 'dark' || (m !== 'light' && (window.AQAndroid && AQAndroid.systemDark ? AQAndroid.systemDark() : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="root"></div>
<script src="shell.js"></script>
<script src="app.js"></script>
</body>
</html>
